[workspace]
members = [
  "tray",
  "crates/companion-shared",
  "crates/companion-config",
  "crates/companion-acp",
  "crates/companion-automation",
  "crates/companion-browser",
  "crates/companion-checkpoint",
  "crates/companion-control",
  "crates/companion-cron",
  "crates/companion-media",
  "crates/companion-memory",
  "crates/companion-runtime",
  "crates/companion-mcp",
  "crates/companion-app",
  "crates/companion-daemon",
  "crates/companion-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.19"
edition = "2021"
license = "MIT"
repository = "https://github.com/Trapezohe/companion_service.git"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
hkdf = "0.12"
http = "1"
http-body-util = "0.1"
nix = { version = "0.29", features = ["process", "signal"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
