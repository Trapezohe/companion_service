[workspace]
members = [
  "tray",
  "crates/companion-shared",
  "crates/companion-config",
  "crates/companion-runtime",
  "crates/companion-mcp",
  "crates/companion-daemon",
  "crates/companion-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.18"
edition = "2021"
license = "MIT"
repository = "https://github.com/trapezohe/companion.git"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
http = "1"
http-body-util = "0.1"
nix = { version = "0.29", features = ["process", "signal"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
