[package]
name = "trapezohe-companion-tray"
version = "0.1.22"
edition = "2021"

[lib]
name = "trapezohe_companion_tray"
path = "src/lib.rs"

[[bin]]
name = "trapezohe-companion-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
anyhow = "1"
companion-config = { path = "../crates/companion-config" }
companion-shared = { path = "../crates/companion-shared" }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
